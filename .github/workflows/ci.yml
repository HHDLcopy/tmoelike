name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n（入口 + 全部模块）
        run: |
          set -e
          bash -n tmoelike.sh
          for f in lib/*.sh; do bash -n "$f"; done
          for f in tests/*.sh tests/cases/*.sh; do bash -n "$f"; done
          echo "语法检查通过"

      - name: 模块清单与 lib/ 一致性
        run: python3 tools/gen_manifest.py --check

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: 运行 ShellCheck（-S warning）
        run: shellcheck -S warning -x tmoelike.sh lib/*.sh tests/run.sh tests/cases/*.sh

  tests:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: 安装测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zstd xz-utils gzip tar python3 file

      - name: 跨模块调用一致性自检
        run: bash tests/lint_calls.sh

      - name: 运行测试套件
        run: bash tests/run.sh
        env:
          # ubuntu-latest 的 jq 与 bash 同在 /usr/bin，deps_prompt 用例依赖
          # “遮蔽目录排在真实目录之前”来伪造缺依赖环境，那种布局下不成立。
          # 只在该 job 跳过该用例；用例逻辑本身不变（本地/Termux 仍会执行）。
          TMOE_SKIP_DEPS_PROMPT: "1"

  tests-termux-like:
    name: 测试（无 proot / 无 find -printf 的降级路径）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zstd xz-utils gzip python3
      - name: 强制走 find -printf 回退
        run: |
          # 用一个不支持 -printf 的 find 包装器，验证回退分支
          mkdir -p /tmp/noprintf
          printf '%s\n' '#!/bin/bash' \
            'case "$*" in' \
            '  *-printf*) echo "find: unknown predicate -printf" >&2; exit 1 ;;' \
            'esac' \
            'exec /usr/bin/find "$@"' > /tmp/noprintf/find
          chmod +x /tmp/noprintf/find
          PATH="/tmp/noprintf:$PATH" bash tests/run.sh core
          PATH="/tmp/noprintf:$PATH" bash tests/run.sh backup
